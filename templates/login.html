<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
           body {
            background: linear-gradient(0deg, #1b1b1b, #2b0000);
            height: 100vh;
        }

        .login-card {
            border-radius: 15px;
            box-shadow: 0px 0px 30px rgba(255, 255, 255, 0.411);
            background: linear-gradient(180deg, #ffffff, #dfdfdf);
        }

        .form-control {
            border-radius: 20px;
            border-style: solid;
            border-color: rgba(43, 43, 43, 0.315);
        }

        .btn-primary {
            border-radius: 20px;
            border-color: rgb(92, 144, 211);
            background-color: rgb(120, 179, 255);
        }
        .btn-primary:hover {
            background-color: rgb(75, 126, 192);
            border-color: rgb(116, 163, 224);
        }

        .link-recuperar {
            font-size: 15px;
            text-decoration: none;
        }

        .link-recuperar:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center">

<div class="col-md-4">
    <div class="card login-card p-4">

        <h3 class="text-center mb-4"><i>INICIO SESIÓN</i></h3>

        <form method="POST" action={{ url_for('login_form')}}>

            <div class="mb-3">
                <label class="form-label"><i>USUARIO</i></label>
                <input type="text" name="txtusuario" class="form-control" placeholder="Usuario" required>
            </div>

            <div class="mb-3">
                <label class="form-label"><i>CONTRASEÑA</i></label>
                <input type="password" name="txtcontrasena" class="form-control" placeholder="Contraseña" required>
            </div>

            <div class="d-flex justify-content-center mb-3">
                <a href="/recuperar" class="link-recuperar text-primary">

                    ¿Olvidaste tu contraseña?

                </a>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary">

                    <i>Iniciar Sesión</i>

                </button>
            </div>

        </form>

    </div>
</div>

</body>
</html>
